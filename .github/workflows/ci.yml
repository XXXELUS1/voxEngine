# voxEngine CI
#   python      - voxgen unit tests + generate every model, previews uploaded as artifact "previews"
#   ext-linux   - build the voxbody GDExtension (debug + release) with cached godot-cpp objects,
#                 generate assets, import the Godot project headless and run res://tests/run_tests.gd;
#                 .so files uploaded as artifact "voxbody-linux"
#   ext-windows - MSVC build of the extension (debug + release); .dll files uploaded as "voxbody-windows"
#                 (the owner can drop them into godot/addons/voxbody/bin/ instead of building locally)
# Library names come from src/voxbody/SConstruct: godot/addons/voxbody/bin/libvoxbody.<platform>.<target>.<arch>.<ext>
name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GODOT_VERSION: '4.7.2'
  PYTHON_VERSION: '3.12'

jobs:
  python:
    name: voxgen (pytest + build-all)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: tools/voxgen/pyproject.toml

      - name: Install voxgen + pytest
        run: python -m pip install -e tools/voxgen pytest

      - name: pytest
        run: python -m pytest -q tools/voxgen

      - name: build-all (models, previews, vox, reports)
        run: >
          python -m voxgen build-all tools/voxgen/specs
          --out godot/assets/models --preview build/previews --vox build/vox

      - name: Upload previews
        uses: actions/upload-artifact@v4
        with:
          name: previews
          path: build/previews/**/*.png
          if-no-files-found: error

  ext-linux:
    name: voxbody extension (linux) + Godot tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: tools/voxgen/pyproject.toml

      - name: Install scons + voxgen
        run: python -m pip install scons -e tools/voxgen

      - name: godot-cpp commit
        id: godotcpp
        run: echo "sha=$(git -C src/voxbody/godot-cpp rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # SCons content-addressed cache (godot-cpp honours $SCONS_CACHE -> CacheDir): a hit means
      # the ~2000 godot-cpp objects are copied instead of compiled. One cache per target.
      - name: Cache godot-cpp build (template_debug)
        uses: actions/cache@v4
        with:
          path: .scons-cache/template_debug
          key: scons-${{ runner.os }}-template_debug-${{ steps.godotcpp.outputs.sha }}
          restore-keys: |
            scons-${{ runner.os }}-template_debug-

      - name: Cache godot-cpp build (template_release)
        uses: actions/cache@v4
        with:
          path: .scons-cache/template_release
          key: scons-${{ runner.os }}-template_release-${{ steps.godotcpp.outputs.sha }}
          restore-keys: |
            scons-${{ runner.os }}-template_release-

      - name: scons target=template_debug
        working-directory: src/voxbody
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons-cache/template_debug
        run: scons -j$(nproc) target=template_debug

      - name: scons target=template_release
        working-directory: src/voxbody
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons-cache/template_release
        run: scons -j$(nproc) target=template_release

      - name: Built libraries
        run: ls -la godot/addons/voxbody/bin/

      - name: Cache Godot ${{ env.GODOT_VERSION }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/voxengine/godot-${{ env.GODOT_VERSION }}
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Install Godot ${{ env.GODOT_VERSION }}
        run: |
          scripts/install_godot.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: build-all (models for the tests)
        run: >
          python -m voxgen build-all tools/voxgen/specs
          --out godot/assets/models --preview build/previews --vox build/vox

      - name: Import Godot project
        run: godot --headless --audio-driver Dummy --path godot --import

      - name: Godot tests
        run: godot --headless --audio-driver Dummy --path godot -s res://tests/run_tests.gd

      - name: Upload linux libraries
        uses: actions/upload-artifact@v4
        with:
          name: voxbody-linux
          path: godot/addons/voxbody/bin/*.so
          if-no-files-found: error

  ext-windows:
    name: voxbody extension (windows, MSVC)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install scons
        run: python -m pip install scons

      - name: godot-cpp commit
        id: godotcpp
        shell: bash
        run: echo "sha=$(git -C src/voxbody/godot-cpp rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache godot-cpp build (template_debug)
        uses: actions/cache@v4
        with:
          path: .scons-cache/template_debug
          key: scons-${{ runner.os }}-template_debug-${{ steps.godotcpp.outputs.sha }}
          restore-keys: |
            scons-${{ runner.os }}-template_debug-

      - name: Cache godot-cpp build (template_release)
        uses: actions/cache@v4
        with:
          path: .scons-cache/template_release
          key: scons-${{ runner.os }}-template_release-${{ steps.godotcpp.outputs.sha }}
          restore-keys: |
            scons-${{ runner.os }}-template_release-

      # scons finds the MSVC toolchain of the runner by itself (use_mingw=no is the default).
      - name: scons target=template_debug
        working-directory: src/voxbody
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons-cache/template_debug
        run: scons -j4 target=template_debug

      - name: scons target=template_release
        working-directory: src/voxbody
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons-cache/template_release
        run: scons -j4 target=template_release

      - name: Built libraries
        shell: bash
        run: ls -la godot/addons/voxbody/bin/

      - name: Upload windows libraries
        uses: actions/upload-artifact@v4
        with:
          name: voxbody-windows
          path: godot/addons/voxbody/bin/*.dll
          if-no-files-found: error
